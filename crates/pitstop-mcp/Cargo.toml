[package]
name = "pitstop-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true
description = "MCP server transport and tool router for pitstop."
# One integration-test binary instead of one per file. Each binary
# statically links the whole dep graph and gets scanned by macOS on
# first run.

[features]
default = []
management-ui = []

[dependencies]
pitstop-core.workspace = true
pitstop-consolidate.workspace = true
pitstop-llm.workspace = true
pitstop-store.workspace = true
pitstop-wiki.workspace = true
anyhow.workspace = true
thiserror.workspace = true
flate2.workspace = true
# Tests insert grant rows directly, so the decision tests do not depend on
# the grant management API.
rusqlite.workspace = true
tar.workspace = true
tempfile.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
rmcp.workspace = true
schemars.workspace = true
axum.workspace = true
http.workspace = true
# HTTP auth middleware: constant-time Bearer compare. Basic is not a
# credential; sessions live in human_auth.
subtle.workspace = true
base64.workspace = true
getrandom.workspace = true
# Time gap calculation for `memory_explore` (parse stored ISO-8601
# timestamps + delta against now). The rest of the crate doesn't
# need a clock dep.
jiff.workspace = true
sha2.workspace = true

[dev-dependencies]
pitstop-core.workspace = true
pitstop-hooks.workspace = true
pitstop-store.workspace = true
# The web search parity test drives `/web` and `/api/v1` next to
# `memory_query`. Test-only: the server crate does not depend on the web UI.
pitstop-web = { workspace = true, features = ["management-ui"] }
pitstop-wiki.workspace = true
async-trait.workspace = true
flate2.workspace = true
secrecy.workspace = true
tar.workspace = true
tempfile.workspace = true
tower.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
