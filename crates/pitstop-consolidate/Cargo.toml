[package]
name = "pitstop-consolidate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true
description = "Karpathy-style ingest / query / lint consolidation pipeline."
# One integration-test binary instead of one per file. Each binary
# statically links the whole dep graph and gets scanned by macOS on
# first run.

[dependencies]
pitstop-core.workspace = true
pitstop-store.workspace = true
pitstop-wiki.workspace = true
pitstop-llm.workspace = true
# NFD diacritic folding for rule slugs (#886); the same crate/version
# pitstop-core already uses for `portable_page_key`, no new dependency.
icu_normalizer.workspace = true
git2.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
# A2 keep-token miner: file paths / URLs / code spans / error codes, compiled
# once via `LazyLock`. Same crate + version the core sanitizer already uses.
regex.workspace = true
sha2.workspace = true
tokio.workspace = true
tracing.workspace = true
jiff.workspace = true
uuid.workspace = true

[dev-dependencies]
pitstop-test-support.workspace = true
async-trait.workspace = true
tempfile.workspace = true
rusqlite.workspace = true
# Test-only: asserts the fresh operation ids are UUID v7 in the
# gateway-compatible 36-character form (same crate + features the
# llm crate already uses to mint them).
uuid.workspace = true

[lints]
workspace = true
