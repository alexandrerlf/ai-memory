name: desktop

# The Tauri desktop installer in companions/pitstop-desktop. It is its own
# Cargo workspace with a webview toolchain (webkit2gtk on Linux), so nothing
# in the core workflows builds it. A pull request touching it runs the check
# job; the bundle job runs on manual dispatch or on a pull request labelled
# `desktop`, and produces UNSIGNED preview installers (signing needs the
# project's own certificates; see the companion's README).
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'companions/pitstop-desktop/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  MANIFEST: companions/pitstop-desktop/Cargo.toml

jobs:
  check:
    name: fmt, clippy, test (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - name: Webview build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev
      - run: cargo fmt --check --manifest-path "$MANIFEST"
      - run: cargo clippy --locked --manifest-path "$MANIFEST" --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path "$MANIFEST"

  bundle:
    name: unsigned bundle (${{ matrix.os }})
    needs: check
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'desktop')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - name: Webview build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev
      - name: Build the pitstop binary the bundle carries
        run: cargo build --release --locked --bin pitstop
      - name: Stage it as the sidecar, with the hook bundle
        run: |
          triple="$(rustc -vV | sed -n 's/^host: //p')"
          ext=""; [ "$RUNNER_OS" = "Windows" ] && ext=".exe"
          dest=companions/pitstop-desktop/binaries
          mkdir -p "$dest"
          cp "target/release/pitstop$ext" "$dest/pitstop-$triple$ext"
          cp -R hooks "$dest/hooks"
      - name: Install the Tauri CLI
        run: cargo install tauri-cli --locked --version 2.9.5
      - name: Build the installers
        working-directory: companions/pitstop-desktop
        run: cargo tauri build --config tauri.bundle.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pitstop-desktop-${{ matrix.os }}-unsigned
          path: |
            companions/pitstop-desktop/target/release/bundle/**/*.deb
            companions/pitstop-desktop/target/release/bundle/**/*.rpm
            companions/pitstop-desktop/target/release/bundle/**/*.AppImage
            companions/pitstop-desktop/target/release/bundle/**/*.dmg
            companions/pitstop-desktop/target/release/bundle/**/*.msi
            companions/pitstop-desktop/target/release/bundle/**/*-setup.exe
          if-no-files-found: error
